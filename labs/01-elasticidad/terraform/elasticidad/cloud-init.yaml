#cloud-config
# Aplicación mínima de demostración para el módulo 1.
#
#   GET /              -> nombre del host que atendió, hora y CPUs. Sirve para mostrar
#                         en vivo que detrás del balanceador hay servidores distintos.
#   GET /health        -> 200 OK. Lo consulta el health checker del balanceador.
#   GET /burn?ms=250   -> quema CPU durante ms milisegundos. Es lo que hace subir la
#                         métrica y disparar el autoescalamiento.
#
# Deliberadamente sin dependencias externas: solo la librería estándar de Python.
# Una instancia nueva del pool queda sirviendo tráfico sin descargar nada de internet,
# que es justo lo que hace predecible el tiempo de arranque en la demo.

write_files:
  - path: /opt/lab/app.py
    permissions: "0755"
    content: |
      import os
      import socket
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import urlparse, parse_qs

      HOSTNAME = socket.gethostname()
      CPUS = os.cpu_count()
      STARTED = time.time()

      def burn(ms):
          end = time.perf_counter() + (ms / 1000.0)
          x = 0
          while time.perf_counter() < end:
              x += 1
          return x

      class Handler(BaseHTTPRequestHandler):
          protocol_version = "HTTP/1.1"

          def _send(self, code, body, ctype="text/plain; charset=utf-8"):
              data = body.encode("utf-8")
              self.send_response(code)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(data)))
              self.end_headers()
              self.wfile.write(data)

          def do_GET(self):
              parsed = urlparse(self.path)

              if parsed.path == "/health":
                  self._send(200, "ok")
                  return

              if parsed.path == "/burn":
                  qs = parse_qs(parsed.query)
                  ms = int(qs.get("ms", ["250"])[0])
                  ms = max(1, min(ms, 5000))
                  burn(ms)
                  self._send(200, "burned {}ms on {}".format(ms, HOSTNAME))
                  return

              uptime = int(time.time() - STARTED)
              self._send(200,
                  "la organización / taller - módulo 1\n"
                  "Atendido por : {}\n"
                  "OCPUs        : {}\n"
                  "Uptime       : {}s\n"
                  "Hora         : {}\n".format(
                      HOSTNAME, CPUS, uptime,
                      time.strftime("%Y-%m-%d %H:%M:%S")))

          def log_message(self, *args):
              pass  # sin ruido en el journal durante la demo

      if __name__ == "__main__":
          ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()

  - path: /etc/systemd/system/lab-app.service
    permissions: "0644"
    content: |
      [Unit]
      Description=ODT módulo 1 - app de demostracion
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/lab/app.py
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Oracle Linux trae firewalld activo y bloquea el 80. Sin esto el health check
  # nunca pasa y el backend queda permanentemente en CRITICAL.
  - firewall-cmd --permanent --add-port=80/tcp
  - firewall-cmd --reload
  - systemctl daemon-reload
  - systemctl enable --now lab-app.service
